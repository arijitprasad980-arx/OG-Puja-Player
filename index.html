<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100d0b" />
    <title>Pujo Radio</title>
    <link rel="stylesheet" href="screen.css" />
    <script src="https://accounts.google.com/gsi/client" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <main id="page" class="screen-canvas" aria-label="Pujo Radio app"></main>
    </div>
    <dialog id="mahalaya-alarm-settings" class="mahalaya-notice" aria-labelledby="mahalaya-alarm-title">
      <div class="mahalaya-notice-content">
        <h1 id="mahalaya-alarm-title">Festival reminders</h1>
        <p class="mahalaya-alarm-status" id="mahalaya-alarm-status" role="status" aria-live="polite"></p>
        <div class="mahalaya-alarm-time-grid">
          <label for="durga-alarm-time">Durga Sasthi reminder <span>Oct 15 &amp; 16</span>
            <input id="durga-alarm-time" type="time" value="04:00" required />
          </label>
          <label for="kali-alarm-time">Kali Puja reminder <span>Nov 7 &amp; 8</span>
            <input id="kali-alarm-time" type="time" value="04:00" required />
          </label>
        </div>
        <button id="mahalaya-alarm-save-times" type="button" class="mahalaya-secondary-button">Save times</button>
        <div class="mahalaya-notice-actions">
          <a class="mahalaya-calendar-link" data-calendar-festival="mahalaya" target="_blank" rel="noopener noreferrer">Mahalaya · Oct 9–10</a>
          <a class="mahalaya-calendar-link" data-calendar-festival="durga" target="_blank" rel="noopener noreferrer">Durga Sasthi · Oct 15–16</a>
          <a class="mahalaya-calendar-link" data-calendar-festival="kali" target="_blank" rel="noopener noreferrer">Kali Puja · Nov 7–8</a>
        </div>
        <form method="dialog">
          <button type="submit" class="mahalaya-secondary-button">Close</button>
        </form>
      </div>
    </dialog>
    <dialog id="mahalaya-notice" class="mahalaya-notice" aria-labelledby="mahalaya-notice-title" aria-describedby="mahalaya-notice-message">
      <div class="mahalaya-notice-content">
        <p class="mahalaya-notice-eyebrow">Mahalaya 2026</p>
        <h1 id="mahalaya-notice-title"></h1>
        <p id="mahalaya-notice-message"></p>
        <form method="dialog">
          <button type="submit">Close</button>
        </form>
      </div>
    </dialog>
    <dialog id="mahalaya-guide" class="mahalaya-notice mahalaya-guide" aria-label="How to set a reminder">
      <div class="mahalaya-guide-header">
        <form method="dialog">
          <button type="submit" class="mahalaya-guide-cancel">Cancel</button>
        </form>
      </div>
      <div class="mahalaya-guide-scroll">
        <img class="mahalaya-guide-image" src="guide.png" alt="Step-by-step guide to setting a reminder and granting Google Calendar access" />
      </div>
    </dialog>
    <dialog id="share-menu" class="mahalaya-notice share-dialog" aria-labelledby="share-menu-title">
      <div class="share-dialog-content">
        <div class="share-dialog-header">
          <h1 id="share-menu-title">Share this website</h1>
          <form method="dialog">
            <button type="submit" class="mahalaya-guide-cancel" aria-label="Close share menu">Cancel</button>
          </form>
        </div>
        <p id="share-menu-status" class="share-menu-status" role="status" aria-live="polite"></p>
        <div class="share-options" aria-label="Share options">
          <button type="button" class="share-option share-option-whatsapp" data-share-target="whatsapp" aria-label="Share on WhatsApp" title="WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.8a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.3-4.9a8.4 8.4 0 1 1 16.2-3.8Z"/><path d="M8.4 7.7c.3-.5.5-.5.8-.5h.5c.2 0 .4.1.5.4l.8 1.9c.1.2.1.4 0 .6l-.6.8c-.2.2-.2.4 0 .6.7 1.2 1.6 2 2.8 2.6.2.1.4.1.6-.1l.8-.9c.2-.2.4-.2.7-.1l1.8.9c.3.1.4.3.4.5 0 .3-.2 1.4-.9 1.9-.6.5-1.4.7-2.2.5-1-.2-2.2-.7-3.7-2-1.8-1.6-2.9-3.5-3.2-4.5-.3-1 .1-2 .7-2.6Z"/></svg></button>
          <button type="button" class="share-option share-option-instagram" data-share-target="instagram" aria-label="Open Instagram" title="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="share-icon-dot" cx="17.5" cy="6.8" r="1"/></svg></button>
          <button type="button" class="share-option share-option-facebook" data-share-target="facebook" aria-label="Share on Facebook" title="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="facebook-mark" d="M14.2 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H8v3.1h2.8v8h3.4Z"/></svg></button>
          <button type="button" class="share-option share-option-copy" data-share-target="copy" aria-label="Copy link" title="Copy link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg></button>
        </div>
      </div>
    </dialog>
    <script src="song-storage.js"></script>
    <script src="google-calendar-config.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
